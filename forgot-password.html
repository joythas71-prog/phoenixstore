<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<link rel="stylesheet" href="index.css">

<style>
  
  html, body, * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#msg{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.back-link{
  text-align:center;
  margin-top:15px;
}

.back-link a{
  text-decoration:none;
}
</style>

</head>
<body>

<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="neu-icon">
        <div class="icon-inner">
          🔐
        </div>
      </div>

      <h2>Reset Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <div class="form-group">
      <div class="input-group neu-input">
        <input
          type="email"
          id="email"
          required
          placeholder=" ">
        <label for="email">Email Address</label>
      </div>
    </div>

    <button
      class="neu-button login-btn"
      onclick="resetPassword()">
      Send Reset Link
    </button>

    <p id="msg"></p>

    <div class="back-link">
      <a href="index.html">← Back to Login</a>
    </div>

  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyABYByDW8bAOCHfCwcRNaSN1wwifQEhzA4",
  authDomain: "freefiretopup-bbb23.firebaseapp.com",
  projectId: "freefiretopup-bbb23",
  storageBucket: "freefiretopup-bbb23.firebasestorage.app",
  messagingSenderId: "305435218774",
  appId: "1:305435218774:web:d258e8218bd1bdec50fcf7",
  measurementId: "G-HLNGZ236PZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.resetPassword = function(){

  const email =
  document.getElementById("email").value;

  const msg =
  document.getElementById("msg");

  if(!email){
    msg.innerHTML =
    "❌ Please enter your email address";
    msg.style.color = "red";
    return;
  }

  sendPasswordResetEmail(auth,email)

  .then(()=>{

    msg.innerHTML =
    "✅ Reset link sent to your email";
    msg.style.color = "black";

  })

  .catch((error)=>{

    msg.innerHTML =
    "❌ " + error.message;
    msg.style.color = "red";

  });

}

</script>

</body>
</html>
