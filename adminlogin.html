<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login</title>
  <link rel="stylesheet" href="media.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>

    html, body, * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}


    body {
      font-family: Arial;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>

<div class="neon-bg"></div>
<style>
.neon-bg{
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 20% 20%, rgba(0,255,255,.12), transparent 20%),
radial-gradient(circle at 80% 30%, rgba(140,0,255,.15), transparent 20%),
radial-gradient(circle at 50% 80%, rgba(255,0,200,.10), transparent 20%);
animation: pulseBg 6s infinite alternate;
z-index:-1;
}
@keyframes pulseBg{
from{transform:scale(1);}
to{transform:scale(1.08);}
}
</style>


  <div class="login-box">
    <h2>Admin Login 🔐</h2>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>
  </div>

  <!-- Firebase + Login Script -->
  <script type="module">
    import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://tvhgxlqqeklrdlgbkosa.supabase.co",
  "sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I"
);

const ADMIN_EMAILS = [
  "joythas13@gmail.com",
  "praveenammu837@gmail.com",
  "ssrianjeevan@gmail.com",
  "javikshanjavi07@gmail.com"
];

window.login = async function () {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const { data, error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    Swal.fire({
      icon: "error",
      title: "Login Failed",
      text: "Invalid Email or Password",
      confirmButtonText: "OK",
      background: "#1e293b",
      color: "#fff",
      confirmButtonColor: "#38bdf8"
    });

    return;
  }

  if (ADMIN_EMAILS.includes(email)) {

    localStorage.setItem("admin", "true");
    window.location.href = "admin.html";

  } else {

    await supabase.auth.signOut();

    Swal.fire({
      icon: "error",
      title: "Access Denied",
      text: "You are not authorized to access the Admin Panel.",
      confirmButtonText: "OK"
    });

  }

};
  </script>

</body>
</html>
