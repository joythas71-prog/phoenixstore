<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHOENIX TK</title>
<link rel="stylesheet" href="index.css">
<link rel="icon" href="1.jpg">
</head>

<body>

<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <h2>Create Account</h2>
      <p>Sign up to continue</p>
    </div>

    <form id="registerForm" class="login-form">


           <div class="form-group">
            <div class="input-group neu-input">
               <input type="text" id="username" required placeholder=" ">
            <label>Username</label>
            </div>
           </div>

      <div class="form-group">
        <div class="input-group neu-input">
          <input type="email" id="email" required placeholder=" ">
          <label>Email address</label>
        </div>
      </div>

      <div class="form-group">
        <div class="input-group neu-input">
          <input type="password" id="password" required placeholder=" ">
          <label>Password</label>
        </div>
      </div>

      <button type="submit" class="neu-button login-btn">
        Create Account
      </button>

      <!-- ✅ FIXED success message -->
      <p id="successMsg" class="success-msg" style="display:none; color:rgb(255, 0, 0);">
        Account Created Successfully ✅
      </p>

    </form>

    <div class="signup-link">
      <p>Already have an account? <a href="index.html">Login</a></p>
    </div>

  </div>
</div>


<style>
/* TABLET */
@media (max-width: 1024px) {
  .card {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* MOBILE */
@media (max-width: 768px) {
  .card {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 24px;
  }
}

/* SMALL MOBILE */
@media (max-width: 480px) {
  h1 {
    font-size: 20px;
  }

  p {
    font-size: 14px;
  }
}

/* Desktop */
.container{
  width: 80%;
  margin: auto;
}
</style>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Supabase details
const supabaseUrl = "https://tvhgxlqqeklrdlgbkosa.supabase.co";
const supabaseKey = "sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I";

const supabase = createClient(supabaseUrl, supabaseKey);


const form = document.getElementById("registerForm");
const msg = document.getElementById("successMsg");


form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();


  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }


  try {

    // Create account
    const { data, error } = await supabase.auth.signUp({
      email,
      password
    });


    if (error) throw error;


    // Save profile
const { error: profileError } = await supabase
  .from("profiles")
  .insert({
    id: data.user.id,
    username: username,
    email: email
  });

if (profileError) {
  throw profileError;
}


    msg.style.display = "block";


    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);


  } catch (error) {
    alert(error.message);
  }

});
</script>

</body>

</html>
