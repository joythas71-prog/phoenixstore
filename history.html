<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>History</title>

<style>
  
  html, body, * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}


body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

.header{
  background:#020617;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #1e293b;
}

.container{
  width:95%;
  max-width:420px;
  margin:15px auto;
}

.card{
  background:#1e293b;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #38bdf8;
  box-shadow:0 0 10px rgba(56,189,248,.25);
  word-wrap:break-word;
}

.card p{
  margin:8px 0;
  font-size:14px;
  line-height:1.5;
}

.success{
  color:#00ff66;
  font-weight:bold;
}

.reject{
  color:#ff4444;
  font-weight:bold;
}

.pending{
  color:#ffb300;
  font-weight:bold;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;

  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  border-top: 1px solid rgba(255,255,255,0.2);

  box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
  z-index: 1000;
}
.nav-item {
  text-align: center;
  text-decoration: none;
  color: #aaa;
  font-size: 12px;
  transition: 0.3s;
}

.nav-item i {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

.nav-item:hover {
  color: #00eaff;
}

.nav-item.active {
  color: #00eaff;
}

/* Mobile */
@media (max-width:600px){

  .header{
    font-size:18px;
    padding:15px;
  }

  .container{
    width:94%;
    margin:10px auto;
  }

  .card{
    padding:10px;
    border-radius:10px;
  }

  .card p{
    font-size:13px;
  }
}

</style>
</head>

<body>

<div class="header">
🕒 Topup History
</div>

<div class="container" id="historyBox">
Loading...
</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://tvhgxlqqeklrdlgbkosa.supabase.co";

const supabaseKey =
"sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I";

const supabase =
createClient(supabaseUrl, supabaseKey);

const box =
document.getElementById("historyBox");

const {
  data: { session }
} = await supabase.auth.getSession();

if (!session) {
  window.location.href = "index.html";
}

const { data: orders, error } =
await supabase
.from("orders")
.select("*")
.eq("user_id", session.user.id)
.order("created_at", { ascending: false });

let html = "";

if (!error) {

  orders.forEach((data) => {

    let colorClass = "pending";

    if (data.status === "success") {
      colorClass = "success";
    } else if (data.status === "reject") {
      colorClass = "reject";
    }

    html += `
<div class="card">

<p>🆔 Order ID : ${data.id}</p>

<p>🎮 UID : ${data.uid}</p>

<p>💎 Topup : ${data.topup}</p>

<p class="${colorClass}">
📌 Status : ${data.status}
</p>

</div>
`;

  });

}

if (html === "") {

  html = `
<div class="card" style="text-align:center;">

<i class="fas fa-clock-rotate-left"
style="font-size:40px;color:#38bdf8;"></i>

<h3>No Top-Up History Found</h3>

<p>Your top-up history will appear here</p>

</div>
`;

}

box.innerHTML = html;

</script>

<div class="bottom-nav">

  <a href="home.html" class="nav-item active">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </a>

  <a href="topup.html" class="nav-item">
    <i class="fas fa-gem"></i>
    <span>Shop</span>
  </a>

  <a href="payment.html" class="nav-item">
    <i class="fas fa-bolt"></i>
    <span>Payment</span>
  </a>

  <a href="history.html" class="nav-item">
  <i class="fas fa-clock-rotate-left"></i>
  <span>History</span>
</a>

  <a href="profile.html" class="nav-item">
    <i class="fas fa-user"></i>
    <span>Profile</span>
  </a>

</div>

</body>
</html>
